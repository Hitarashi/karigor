[package]
name = "karigor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Framework-agnostic, developer-friendly CLI application builder and terminal UI toolkit for Rust"
repository = "https://github.com/Hitarashi/karigor"
readme = "README.md"
keywords = ["cli", "terminal", "console", "ui", "framework"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
borno = { git = "https://github.com/Hitarashi/borno.git", branch = "main" }
minijinja = { version = "3.1.0", features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.154"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
